<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Navy background with rounded corners -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>
  <!-- Three ascending bars — RNA-seq expression levels -->
  <rect x="5"  y="20" width="5" height="8"  rx="1.5" fill="#0d9488"/>
  <rect x="13" y="13" width="5" height="15" rx="1.5" fill="#14b8a6"/>
  <rect x="21" y="7"  width="5" height="21" rx="1.5" fill="#5eead4"/>
  <!-- Subtle baseline -->
  <rect x="5" y="29" width="21" height="1.5" rx="0.75" fill="#334155"/>
</svg>
